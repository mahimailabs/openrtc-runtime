name: Web

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/web.yml'

jobs:
  validate-docs:
    name: Validate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docs structure and house style
        # Stdlib-only validator: every page in docs/meta.json has its file (and is in
        # web/docs/lib/source.ts),
        # no orphans, internal links resolve, required frontmatter, no em dashes.
        run: python3 docs/_check_docs.py

  # Both sites deploy from Cloudflare after merge. A page that fails to render would
  # otherwise only surface as a failed deploy.
  build:
    name: Build ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [docs, landing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --prefix web/${{ matrix.site }}
      - run: npm run build --prefix web/${{ matrix.site }}
